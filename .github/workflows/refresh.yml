name: Review a source refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-source-refresh
  cancel-in-progress: false

jobs:
  candidate:
    name: Build a private review candidate from trusted main
    # A branch dispatch must not turn unreviewed code into a credentialed refresh.
    # Public release requires a separate visibility and publishing decision.
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      SITE_BASE: /
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Check out reviewed main without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and registry before a live refresh
        run: |
          npm run typecheck
          npm run catalog:check
      - name: Read only registered public GitHub sources
        # The repository-scoped, read-only token is available only to this step.
        # No PAT, deployment credential, or organization-wide credential is used.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:refresh
      - name: Build and validate the refreshed candidate
        env:
          SOURCE_BATCH: .cache/batch.json
        run: npm run build
      - name: Verify contracts and offline regression behavior
        run: npm test
      - name: Upload only the generated website for private review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            !dist/**/.cache/**
            !dist/**/.git/**
            !dist/**/design/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
