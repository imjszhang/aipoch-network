name: Review a source refresh

on:
  workflow_dispatch:
    inputs:
      site_base:
        description: Static candidate base path; this does not deploy a website
        type: choice
        required: true
        default: /
        options:
          - /
          - /aipoch-network/

permissions:
  contents: read
  actions: read

concurrency:
  group: trusted-source-refresh
  cancel-in-progress: false

jobs:
  candidate:
    name: Build a review candidate from trusted main
    # A branch dispatch must not turn unreviewed code into a credentialed refresh.
    # Public release was authorized by the owner; retained state must remain complete.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      SITE_BASE: ${{ inputs.site_base || '/' }}
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Check out reviewed main without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and registry before a live refresh
        run: |
          npm run typecheck
          npm run catalog:check
      - name: Restore bounded state from a successful trusted main refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run refresh:restore
      - name: Read only registered public GitHub sources
        id: source_refresh
        # The repository-scoped, read-only token is available only to this step.
        # No PAT, deployment credential, or organization-wide credential is used.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:refresh
      - name: Build and validate the refreshed candidate
        env:
          SOURCE_BATCH: .cache/batch.json
          HISTORY_DIRECTORY: .cache/restored-history
          REFRESH_REPORT: .cache/refresh-report.json
        run: npm run build
      - name: Verify contracts and offline regression behavior
        run: npm test
      - name: Keep bounded public observations for the next trusted refresh
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-refresh-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/refresh-state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Retain suppression evidence even after a failed candidate
        if: always() && steps.source_refresh.outcome != 'skipped' && hashFiles('.cache/source-suppressions.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-source-suppressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/source-suppressions.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Upload only the generated website for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            !dist/**/.cache/**
            !dist/**/.git/**
            !dist/**/design/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
