name: Schedule a trusted source refresh

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: schedule-source-refresh
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Dispatch the same reviewed main workflow used by maintainers. No checkout,
      # dependency installation or upstream content executes with this permission.
      - name: Request a root-path candidate from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f site_base=/
