{
  "name": "Catalog: Correct content",
  "description": "Correct descriptions, classification, duplicates, or links. Use the separate withdrawal form for removal.",
  "title": "[Correction] ",
  "labels": [
    "catalog:correction",
    "stage:triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is a public GitHub issue. Do not submit credentials or private material. Submission does not imply approval, indexing, or publication. Claims require an independent reviewer. For removal, use the separate [withdrawal form](https://github.com/imjszhang/aipoch-network/issues/new?template=withdrawal.yml). Maintainers will reroute requests submitted through the wrong form; resubmission is unnecessary."
      }
    },
    {
      "type": "textarea",
      "id": "field_0",
      "attributes": {
        "label": "Catalog ID or public source URL",
        "description": "Identify the catalog object. Do not provide private links."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_1",
      "attributes": {
        "label": "Requested change and scope",
        "description": "Describe the correction and its basis."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_2",
      "attributes": {
        "label": "Public evidence",
        "description": "Link public evidence or the original decision. Only describe the need for restricted verification."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
