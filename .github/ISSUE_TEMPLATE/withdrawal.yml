{
  "name": "Catalog: Request withdrawal",
  "description": "Request removal of specified catalog content.",
  "title": "[Withdrawal] ",
  "labels": [
    "catalog:withdrawal",
    "stage:triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is a public GitHub issue. Do not submit credentials or private material. Submission does not imply approval, indexing, or publication. Claims require an independent reviewer."
      }
    },
    {
      "type": "textarea",
      "id": "field_0",
      "attributes": {
        "label": "Catalog ID or public source URL",
        "description": "Identify the catalog object. Do not provide private links."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_1",
      "attributes": {
        "label": "Withdrawal scope and basis",
        "description": "Specify fields, entries, and historical artifacts. Do not upload private proof."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_2",
      "attributes": {
        "label": "Public evidence",
        "description": "Link public evidence or the original decision. Only describe the need for restricted verification."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
