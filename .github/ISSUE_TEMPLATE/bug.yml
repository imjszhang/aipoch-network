{
  "name": "Product: Report a bug",
  "description": "Report website, search, connection interaction, or public contract failures. Use catalog correction for content errors.",
  "title": "[Bug] ",
  "labels": [
    "product:bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is a public GitHub issue. Do not submit credentials or private material. Submission does not imply approval, indexing, or publication. Claims require an independent reviewer."
      }
    },
    {
      "type": "textarea",
      "id": "field_0",
      "attributes": {
        "label": "Page or version",
        "description": "Provide the public page and browser or client version."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_1",
      "attributes": {
        "label": "Steps to reproduce, expected and actual results",
        "description": "Include only necessary information with sensitive details removed."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
