{
  "name": "目录申请：认领与组织策展",
  "description": "核验维护身份、组织策展或变更既有授权。",
  "title": "[认领] ",
  "labels": [
    "catalog:claim",
    "stage:triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "此入口是公开 GitHub Issue。不要提交凭据或私人材料。提交不等于批准、收录或发布；认领由独立审核者核验。"
      }
    },
    {
      "type": "textarea",
      "id": "field_0",
      "attributes": {
        "label": "对象 ID 或公开来源 URL",
        "description": "填写明确的目录对象；不必提供私人链接。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_1",
      "attributes": {
        "label": "GitHub 身份",
        "description": "提交此申请本身不是权限证据。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_2",
      "attributes": {
        "label": "授权范围与请求类型",
        "description": "仓库认领、组织策展、复核或撤销授权；列出对象和期限。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_3",
      "attributes": {
        "label": "授权依据",
        "description": "组织 owner 或明确委派证据；不能仅凭组织成员或 PR 记录。受限核验只说明需要，不上传材料。"
      },
      "validations": {
        "required": true
      }
    }
  ]
}
