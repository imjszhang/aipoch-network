{
  "name": "Catalog: Claim maintenance or organization curation",
  "description": "Verify maintenance authority, organization curation, or changes to existing authorization.",
  "title": "[Claim] ",
  "labels": [
    "catalog:claim",
    "stage:triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is a public GitHub issue. Do not submit credentials or private material. Submission does not imply approval, indexing, or publication. Claims require an independent reviewer."
      }
    },
    {
      "type": "textarea",
      "id": "field_0",
      "attributes": {
        "label": "Catalog ID or public source URL",
        "description": "Identify the catalog object. Do not provide private links."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_1",
      "attributes": {
        "label": "GitHub identity",
        "description": "Submitting this request is not evidence of authority."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_2",
      "attributes": {
        "label": "Authorization scope and request type",
        "description": "Specify repository maintenance, organization curation, review, or revocation; list objects and duration."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field_3",
      "attributes": {
        "label": "Evidence of authority",
        "description": "Provide organization owner authority or explicit delegation. Membership or PR history alone is insufficient. Describe any need for restricted verification without uploading private evidence."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
